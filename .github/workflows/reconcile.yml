# Runs the tests on every push, and the reconciliation every weekday morning (06:15 UTC).
# Add an ANTHROPIC_API_KEY repository secret to let Claude read the printed statement and write the email;
# without it the deterministic parser and templates are used.
name: reconcile
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1-5'
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Reconcile the agent statement
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-${{ github.run_number }}
          path: out/
